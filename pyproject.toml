[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "ride-forces-analyzer"
version = "0.1.0"
description = "Offline Windows desktop application for Ride Forces measurement analysis and video visualization"
authors = [{ name = "Björn Rudner" }]
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14.6,<3.15"
dependencies = ["PySide6>=6.12.0,<7", "pydantic>=2.14.1,<3"]

[project.optional-dependencies]
analysis = [
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pint==0.26.1",
    "pyqtgraph>=0.14.0",
    "scipy==1.18.1",
]
render = ["Pillow>=12.3.0"]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.17.0", "mypy>=2.4.0", "pytest-qt>=4.5.0"]

[project.scripts]
ride-forces-analyzer = "ride_forces_analyzer.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ride_forces_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["F", "COM812"]

[tool.ruff.format]
line-ending = "lf"
skip-magic-trailing-comma = false

[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true
python_version = "3.14"
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true

[tool.uv]
prerelease = "disallow"

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true

[tool.pyright]
include = ["src", "tests"]
exclude = [".venv", ".tmp", "node_modules", "**/__pycache__"]
extraPaths = ["src"]
pythonVersion = "3.14"
pythonPlatform = "Windows"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
