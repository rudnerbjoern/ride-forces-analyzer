enhancement:
  - head-branch: '^feat/'

bug:
  - head-branch: '^fix/'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - docs/images/**

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - pyproject.toml
          - uv.lock
          - package.json
          - package-lock.json
          - .github/dependabot.yml

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**
          - .github/scripts/**
          - .github/labeler.yml
          - .github/release.yml
          - tests/ci/**
