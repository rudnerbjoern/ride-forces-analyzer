name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    with:
      full-checks: true
  source:
    needs: quality
    permissions:
      contents: read
      pull-requests: read
    outputs:
      prerelease: ${{ steps.policy.outputs.prerelease }}
      commit: ${{ steps.revision.outputs.commit }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.14.6'
      - run: uv sync --locked --all-extras --group dev
      - name: Resolve release commit
        id: revision
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve release commit.' }
          "commit=$commit" >> $env:GITHUB_OUTPUT
      - name: Verify release policy
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_SHA: ${{ steps.revision.outputs.commit }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: uv run --locked python .github/scripts/check-release-policy.py --tag "$env:RELEASE_TAG" --sha "$env:RELEASE_SHA" --repository "$env:RELEASE_REPOSITORY"
      - name: Validate source archive
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force .tmp/release | Out-Null
          git archive --format=zip --output=.tmp/release/source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive creation failed.' }
          uv run --locked python .github/scripts/check-source-release.py .tmp/release/source.zip --tag "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Source archive validation failed.' }
      - name: Build Python packages
        run: uv build --out-dir .tmp/release/packages
      - name: Retain verified source archive
        uses: actions/upload-artifact@v7.0.2
        with:
          path: .tmp/release/source.zip
          archive: false
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Retain source checksum
        uses: actions/upload-artifact@v7.0.2
        with:
          path: .tmp/release/SHA256SUMS.txt
          archive: false
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Retain prepared release notes
        uses: actions/upload-artifact@v7.0.2
        with:
          path: .tmp/release/release-notes.md
          archive: false
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build and verify Windows downloads
    needs: [quality, source]
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      exe: ${{ steps.build.outputs.exe }}
      standard: ${{ steps.build.outputs.standard }}
      complete: ${{ steps.build.outputs.complete }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.commit }}
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.14.6'
      - run: uv sync --locked --all-extras --group dev --group build
      - name: Build release executables and both ZIP variants
        id: build
        run: uv run --locked --group build python -m scripts.build_windows --release
      - name: Verify actual Windows downloads
        run: |
          $recording = (Get-ChildItem tests/fixtures/real/Manta-*.forces | Select-Object -First 1).FullName
          uv run --locked --group build python -m scripts.check_windows_packages .tmp/windows-build/assets --recording "$recording"
      - name: Retain standalone executable
        uses: actions/upload-artifact@v7.0.2
        with:
          path: .tmp/windows-build/assets/${{ steps.build.outputs.exe }}
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Retain standard ZIP
        uses: actions/upload-artifact@v7.0.2
        with:
          path: .tmp/windows-build/assets/${{ steps.build.outputs.standard }}
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Retain complete ZIP
        uses: actions/upload-artifact@v7.0.2
        with:
          path: .tmp/windows-build/assets/${{ steps.build.outputs.complete }}
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Retain Windows checksums
        uses: actions/upload-artifact@v7.0.2
        with:
          path: .tmp/windows-build/assets/WINDOWS-SHA256SUMS.txt
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Retain corresponding sources
        uses: actions/upload-artifact@v7.0.2
        with:
          path: .tmp/windows-build/assets/corresponding-sources.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish verified release
    needs: [quality, source, windows]
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_SHA: ${{ needs.source.outputs.commit }}
      RELEASE_PREVIEW: ${{ needs.source.outputs.prerelease }}
      WINDOWS_EXE: ${{ needs.windows.outputs.exe }}
      WINDOWS_STANDARD: ${{ needs.windows.outputs.standard }}
      WINDOWS_COMPLETE: ${{ needs.windows.outputs.complete }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.commit }}
      - name: Download verified source from this run
        uses: actions/download-artifact@v8.0.2
        with:
          name: source.zip
          path: .tmp/release
          skip-decompress: true
      - name: Download source checksum from this run
        uses: actions/download-artifact@v8.0.2
        with:
          name: SHA256SUMS.txt
          path: .tmp/release
          skip-decompress: true
      - name: Download prepared notes from this run
        uses: actions/download-artifact@v8.0.2
        with:
          name: release-notes.md
          path: .tmp/release
          skip-decompress: true
      - name: Download verified standalone executable
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ needs.windows.outputs.exe }}
          path: .tmp/release
          skip-decompress: true
      - name: Download verified standard ZIP
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ needs.windows.outputs.standard }}
          path: .tmp/release
          skip-decompress: true
      - name: Download verified complete ZIP
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ needs.windows.outputs.complete }}
          path: .tmp/release
          skip-decompress: true
      - name: Download Windows checksums
        uses: actions/download-artifact@v8.0.2
        with:
          name: WINDOWS-SHA256SUMS.txt
          path: .tmp/release
          skip-decompress: true
      - name: Download corresponding sources
        uses: actions/download-artifact@v8.0.2
        with:
          name: corresponding-sources.zip
          path: .tmp/release
          skip-decompress: true
      - name: Verify artifacts and current tag before publication
        run: |
          $checksum = (Get-Content .tmp/release/SHA256SUMS.txt -Raw).Trim()
          $actual = (Get-FileHash .tmp/release/source.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($checksum -ne "$actual  source.zip") { throw 'Downloaded source checksum mismatch.' }
          $expected = @($env:WINDOWS_EXE, $env:WINDOWS_STANDARD, $env:WINDOWS_COMPLETE, 'corresponding-sources.zip')
          $entries = @{}
          foreach ($line in Get-Content .tmp/release/WINDOWS-SHA256SUMS.txt) {
            if ($line -notmatch '^([a-f0-9]{64})  ([A-Za-z0-9][A-Za-z0-9._-]*)$') { throw 'Invalid Windows checksum entry.' }
            if ($entries.ContainsKey($Matches[2])) { throw 'Duplicate Windows checksum entry.' }
            $entries[$Matches[2]] = $Matches[1]
          }
          if ($entries.Count -ne $expected.Count) { throw 'Unexpected Windows artifact count.' }
          foreach ($name in $expected) {
            if ($name -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*$' -or -not $entries.ContainsKey($name)) { throw 'Missing Windows artifact.' }
            $actual = (Get-FileHash (Join-Path '.tmp/release' $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($entries[$name] -ne $actual) { throw 'Windows artifact checksum mismatch.' }
          }
          git fetch origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify remote release tag.' }
          $tagCommit = git rev-parse 'FETCH_HEAD^{commit}'
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:RELEASE_SHA) { throw 'Release tag moved.' }
          if ($env:RELEASE_PREVIEW -notin @('true', 'false')) { throw 'Missing release classification.' }
      - name: Publish GitHub Release
        run: |
          $arguments = @('release', 'create', $env:RELEASE_TAG,
            '.tmp/release/source.zip', '.tmp/release/SHA256SUMS.txt',
            ('.tmp/release/' + $env:WINDOWS_EXE),
            ('.tmp/release/' + $env:WINDOWS_STANDARD),
            ('.tmp/release/' + $env:WINDOWS_COMPLETE),
            '.tmp/release/WINDOWS-SHA256SUMS.txt', '.tmp/release/corresponding-sources.zip',
            '--verify-tag', '--target', $env:RELEASE_SHA, '--title', $env:RELEASE_TAG,
            '--notes-file', '.tmp/release/release-notes.md', '--generate-notes')
          if ($env:RELEASE_PREVIEW -eq 'true') { $arguments += @('--prerelease', '--latest=false') }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; inspect remote state before retrying.' }
