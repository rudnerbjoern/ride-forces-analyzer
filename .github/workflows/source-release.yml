name: Source release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    with:
      full-checks: true
  source:
    needs: quality
    permissions:
      contents: read
      pull-requests: read
    outputs:
      prerelease: ${{ steps.policy.outputs.prerelease }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.14.6'
      - run: uv sync --locked --all-extras --group dev
      - name: Verify release policy
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: uv run --locked python .github/scripts/check-release-policy.py --tag "$env:RELEASE_TAG" --sha "$env:RELEASE_SHA" --repository "$env:RELEASE_REPOSITORY"
      - name: Validate source archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force .tmp/release | Out-Null
          git archive --format=zip --output=.tmp/release/source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive creation failed.' }
          uv run --locked python .github/scripts/check-source-release.py .tmp/release/source.zip --tag "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Source archive validation failed.' }
      - name: Build Python packages
        run: uv build --out-dir .tmp/release/packages
      - name: Retain verified source archive
        uses: actions/upload-artifact@v7.0.2
        with:
          path: .tmp/release/source.zip
          archive: false
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Retain source checksum
        uses: actions/upload-artifact@v7.0.2
        with:
          path: .tmp/release/SHA256SUMS.txt
          archive: false
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Retain prepared release notes
        uses: actions/upload-artifact@v7.0.2
        with:
          path: .tmp/release/release-notes.md
          archive: false
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish source release
    needs: [quality, source]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_PREVIEW: ${{ needs.source.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Download verified source from this run
        uses: actions/download-artifact@v8.0.2
        with:
          name: source.zip
          path: .tmp/release
      - name: Download source checksum from this run
        uses: actions/download-artifact@v8.0.2
        with:
          name: SHA256SUMS.txt
          path: .tmp/release
      - name: Download prepared notes from this run
        uses: actions/download-artifact@v8.0.2
        with:
          name: release-notes.md
          path: .tmp/release
      - name: Verify artifacts and current tag before publication
        run: |
          $checksum = (Get-Content .tmp/release/SHA256SUMS.txt -Raw).Trim()
          $actual = (Get-FileHash .tmp/release/source.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($checksum -ne "$actual  source.zip") { throw 'Downloaded source checksum mismatch.' }
          git fetch origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify remote release tag.' }
          $tagCommit = git rev-parse 'FETCH_HEAD^{commit}'
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:RELEASE_SHA) { throw 'Release tag moved.' }
          if ($env:RELEASE_PREVIEW -notin @('true', 'false')) { throw 'Missing release classification.' }
      - name: Publish GitHub Release
        run: |
          $arguments = @('release', 'create', $env:RELEASE_TAG,
            '.tmp/release/source.zip', '.tmp/release/SHA256SUMS.txt',
            '--verify-tag', '--target', $env:RELEASE_SHA, '--title', $env:RELEASE_TAG,
            '--notes-file', '.tmp/release/release-notes.md', '--generate-notes')
          if ($env:RELEASE_PREVIEW -eq 'true') { $arguments += @('--prerelease', '--latest=false') }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; inspect remote state before retrying.' }
