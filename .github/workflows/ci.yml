name: CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      full-checks:
        type: boolean
        required: true
      revision:
        type: string
        required: false
      upload-packages:
        type: boolean
        required: false
        default: false
      reuse-application-checks:
        type: boolean
        required: false
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  gitleaks:
    name: Secret scanning
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.revision || github.sha }}
      - name: Cache Gitleaks archive
        uses: actions/cache@v6.1.0
        with:
          path: .tmp/gitleaks/gitleaks_8.30.1_windows_x64.zip
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e
      - name: Install checksum-pinned Gitleaks
        run: |
          New-Item -ItemType Directory -Force .tmp/gitleaks | Out-Null
          $archive = '.tmp/gitleaks/gitleaks_8.30.1_windows_x64.zip'
          if (-not (Test-Path $archive)) {
            curl.exe --fail --silent --show-error --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 120 --proto '=https' https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip --output $archive
            if ($LASTEXITCODE -ne 0) { throw 'Gitleaks download failed.' }
          }
          $expected = 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Gitleaks checksum mismatch.' }
          Expand-Archive -Path $archive -DestinationPath .tmp/gitleaks -Force
          [IO.File]::WriteAllLines('.tmp/gitleaks/rules.toml', @('[extend]', 'useDefault = true'))
          [IO.File]::WriteAllText('.tmp/gitleaks/empty-ignore', '')
      - name: Verify scanner detection and redaction
        run: ./.github/scripts/test-gitleaks.ps1
      - name: Scan complete fetched Git history
        run: |
          .tmp/gitleaks/gitleaks.exe git --log-opts=--all --config=.tmp/gitleaks/rules.toml --gitleaks-ignore-path=.tmp/gitleaks/empty-ignore --ignore-gitleaks-allow --redact=100 --no-banner --no-color --exit-code 1 --report-format json --report-path .tmp/gitleaks/report.json .
          if ($LASTEXITCODE -ne 0) { throw 'Secret scan failed; review the redacted scan output.' }

  dependency-check:
    name: CI selection and dependency checks
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
      documentation: ${{ steps.changes.outputs.documentation }}
      skills: ${{ steps.changes.outputs.skills }}
      workflows: ${{ steps.changes.outputs.workflows }}
      dependencies: ${{ steps.changes.outputs.dependencies }}
      posix: ${{ steps.changes.outputs.posix }}
      stream-deck: ${{ steps.changes.outputs.stream-deck }}
      stream-deck-integration: ${{ steps.changes.outputs.stream-deck-integration }}
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.tmp/npm-cache
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - run: node --test tests/ci/changes.test.mjs
      - id: changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_FULL_CHECKS: ${{ inputs.full-checks || false }}
          CI_REUSE_APPLICATION_CHECKS: ${{ inputs.reuse-application-checks || false }}
        run: node .github/scripts/ci-changes.mjs
      - name: Cache npm packages
        if: ${{ steps.changes.outputs.dependencies == 'true' }}
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.NPM_CONFIG_CACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('.node-version') }}-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('.node-version') }}-
      - if: ${{ steps.changes.outputs.dependencies == 'true' }}
        run: npm ci --no-audit --no-fund
      - if: ${{ steps.changes.outputs.dependencies == 'true' }}
        run: npm run test:dependencies
      - if: ${{ steps.changes.outputs.dependencies == 'true' && steps.changes.outputs.code != 'true' && steps.changes.outputs.documentation != 'true' && steps.changes.outputs.skills != 'true' && steps.changes.outputs.stream-deck != 'true' }}
        run: npm run spellcheck

  actionlint:
    name: Workflow validation
    needs: dependency-check
    if: ${{ needs.dependency-check.outputs.workflows == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.sha }}
      - name: Cache actionlint archive
        uses: actions/cache@v6.1.0
        with:
          path: .tmp/actionlint/actionlint_1.7.12_windows_amd64.zip
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-6e7241b51e6817ea6a047693d8e6fed13b31819c9a0dd6c5a726e1592d22f6e9
      - name: Install checksum-pinned actionlint
        run: |
          New-Item -ItemType Directory -Force .tmp/actionlint | Out-Null
          $archive = '.tmp/actionlint/actionlint_1.7.12_windows_amd64.zip'
          if (-not (Test-Path $archive)) {
            curl.exe --fail --silent --show-error --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 120 --proto '=https' https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_windows_amd64.zip --output $archive
            if ($LASTEXITCODE -ne 0) { throw 'actionlint download failed.' }
          }
          $expected = '6e7241b51e6817ea6a047693d8e6fed13b31819c9a0dd6c5a726e1592d22f6e9'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'actionlint checksum mismatch.' }
          Expand-Archive -Path $archive -DestinationPath .tmp/actionlint -Force
      - name: Validate all workflows
        run: |
          .tmp/actionlint/actionlint.exe -verbose '-shellcheck=' '-pyflakes='
          if ($LASTEXITCODE -ne 0) { throw 'Workflow validation failed.' }

  code:
    name: Application quality and tests
    needs: dependency-check
    if: ${{ needs.dependency-check.outputs.code == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.tmp/npm-cache
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Identify tested content
        run: 'Write-Output "Tested tree: $(git rev-parse ''HEAD^{tree}'')"'
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.0'
          python-version: '3.14.6'
          enable-cache: true
          cache-suffix: dev
      - run: uv sync --locked --all-extras --group dev
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - name: Cache npm packages
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.NPM_CONFIG_CACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('.node-version') }}-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('.node-version') }}-
      - run: npm ci --no-audit --no-fund
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check src tests
      - run: uv run --locked mypy src
      - run: npm run typecheck
      - run: npm run test:types
      - if: ${{ needs.dependency-check.outputs.documentation != 'true' }}
        run: npm run spellcheck
      - name: Application tests
        id: pytest
        run: uv run --locked pytest --ignore=tests/ui --ignore=tests/integration/stream_deck -ra --durations=20 --junitxml=.tmp/test-results/application.xml
      - name: Retain application test report
        if: ${{ !cancelled() && (steps.pytest.outcome == 'success' || steps.pytest.outcome == 'failure') }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: application-test-results
          path: .tmp/test-results/application.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  ui:
    name: User interface and screenshots
    needs: dependency-check
    if: ${{ needs.dependency-check.outputs.code == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Identify tested content
        run: 'Write-Output "Tested tree: $(git rev-parse ''HEAD^{tree}'')"'
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.0'
          python-version: '3.14.6'
          enable-cache: true
          cache-suffix: dev
      - run: uv sync --locked --all-extras --group dev
      - name: Native UI tests
        id: pytest
        run: uv run --locked pytest tests/ui -ra --durations=20 --junitxml=.tmp/test-results/ui.xml
      - name: Retain UI test report
        if: ${{ !cancelled() && (steps.pytest.outcome == 'success' || steps.pytest.outcome == 'failure') }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ui-test-results
          path: .tmp/test-results/ui.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  skills:
    name: Delivery tooling checks
    needs: dependency-check
    if: ${{ needs.dependency-check.outputs.skills == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.tmp/npm-cache
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.0'
          python-version: '3.14.6'
          enable-cache: true
          cache-suffix: dev
      - run: uv sync --locked --all-extras --group dev
      - run: uv run --locked ruff check .agents/skills/github-delivery
      - run: uv run --locked ruff format --check .agents/skills/github-delivery
      - run: uv run --locked mypy .agents/skills/github-delivery/scripts/git_delivery.py .agents/skills/github-delivery/tests/test_github_delivery.py
      - name: Delivery skill tests
        id: pytest
        run: uv run --locked pytest .agents/skills/github-delivery/tests -ra --durations=20 --junitxml=.tmp/test-results/skills.xml
      - name: Retain delivery skill test report
        if: ${{ !cancelled() && (steps.pytest.outcome == 'success' || steps.pytest.outcome == 'failure') }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: skill-test-results
          path: .tmp/test-results/skills.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - if: ${{ needs.dependency-check.outputs.code != 'true' && needs.dependency-check.outputs.documentation != 'true' }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - name: Cache npm packages
        if: ${{ needs.dependency-check.outputs.code != 'true' && needs.dependency-check.outputs.documentation != 'true' }}
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.NPM_CONFIG_CACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('.node-version') }}-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('.node-version') }}-
      - if: ${{ needs.dependency-check.outputs.code != 'true' && needs.dependency-check.outputs.documentation != 'true' }}
        run: npm ci --no-audit --no-fund
      - if: ${{ needs.dependency-check.outputs.code != 'true' && needs.dependency-check.outputs.documentation != 'true' }}
        run: npm run spellcheck

  documentation:
    name: Documentation and links
    needs: dependency-check
    if: ${{ needs.dependency-check.outputs.documentation == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.tmp/npm-cache
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - name: Cache npm packages
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.NPM_CONFIG_CACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('.node-version') }}-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('.node-version') }}-
      - run: npm ci --no-audit --no-fund
      - run: npm run test:docs

  stream-deck:
    name: Stream Deck plugin
    needs: dependency-check
    if: ${{ needs.dependency-check.outputs.stream-deck == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.tmp/npm-cache
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.revision || github.sha }}
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.0'
          python-version: '3.14.6'
          enable-cache: true
          cache-suffix: dev
      - run: uv sync --locked --all-extras --group dev
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - name: Cache npm packages
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.NPM_CONFIG_CACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('.node-version') }}-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('.node-version') }}-
      - run: npm ci --no-audit --no-fund
      - name: Lint Stream Deck plugin
        run: npm run lint --workspace plugins/stream-deck
      - name: Check Stream Deck formatting
        run: npm run format:check --workspace plugins/stream-deck
      - run: npm run test:stream-deck
      - name: Pack tested plugin for release
        if: ${{ inputs.upload-packages == true }}
        run: |
          npm run pack:built-plugin --workspace plugins/stream-deck
          if ($LASTEXITCODE -ne 0) { throw 'Plugin packing failed.' }
          $name = 'Ride-Forces-Analyzer.streamDeckPlugin'
          $hash = (Get-FileHash ".tmp/stream-deck-package/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content .tmp/stream-deck-package/PLUGIN-SHA256SUMS.txt -Encoding ascii
      - name: Retain installable plugin
        if: ${{ inputs.upload-packages == true }}
        uses: actions/upload-artifact@v7.0.2
        with:
          path: .tmp/stream-deck-package/Ride-Forces-Analyzer.streamDeckPlugin
          archive: false
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Retain plugin checksum
        if: ${{ inputs.upload-packages == true }}
        uses: actions/upload-artifact@v7.0.2
        with:
          path: .tmp/stream-deck-package/PLUGIN-SHA256SUMS.txt
          archive: false
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - if: ${{ needs.dependency-check.outputs.code != 'true' && needs.dependency-check.outputs.documentation != 'true' && needs.dependency-check.outputs.skills != 'true' }}
        run: npm run spellcheck

  stream-deck-integration:
    name: Stream Deck interoperability
    needs: dependency-check
    if: ${{ needs.dependency-check.outputs.stream-deck-integration == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.tmp/npm-cache
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.0'
          python-version: '3.14.6'
          enable-cache: true
          cache-suffix: dev
      - run: uv sync --locked --all-extras --group dev
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - name: Cache npm packages
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.NPM_CONFIG_CACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('.node-version') }}-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('.node-version') }}-
      - run: npm ci --no-audit --no-fund
      - name: Native application/plugin interoperability
        id: pytest
        run: uv run --locked pytest tests/integration/stream_deck -ra --durations=20 --junitxml=.tmp/test-results/stream-deck-integration.xml
      - name: Retain interoperability test report
        if: ${{ !cancelled() && (steps.pytest.outcome == 'success' || steps.pytest.outcome == 'failure') }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: stream-deck-integration-test-results
          path: .tmp/test-results/stream-deck-integration.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  posix:
    name: Linux and macOS packages
    needs: dependency-check
    if: ${{ needs.dependency-check.outputs.posix == 'true' }}
    uses: ./.github/workflows/posix-packages.yml
    with:
      revision: ${{ inputs.revision || github.sha }}
      upload-packages: ${{ inputs.upload-packages || false }}

  check:
    # Stable required check-run name used by branch protection and delivery tooling.
    name: check
    needs: [dependency-check, code, ui, documentation, skills, gitleaks, actionlint, posix, stream-deck, stream-deck-integration]
    if: ${{ always() }}
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Require successful applicable checks
        env:
          DEPENDENCY_RESULT: ${{ needs.dependency-check.result }}
          CONTRACTS_REQUIRED: ${{ needs.dependency-check.outputs.dependencies }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          CODE_REQUIRED: ${{ needs.dependency-check.outputs.code }}
          UI_REQUIRED: ${{ needs.dependency-check.outputs.code }}
          POSIX_REQUIRED: ${{ needs.dependency-check.outputs.posix }}
          STREAM_DECK_REQUIRED: ${{ needs.dependency-check.outputs.stream-deck }}
          STREAM_DECK_INTEGRATION_REQUIRED: ${{ needs.dependency-check.outputs.stream-deck-integration }}
          DOCUMENTATION_REQUIRED: ${{ needs.dependency-check.outputs.documentation }}
          SKILLS_REQUIRED: ${{ needs.dependency-check.outputs.skills }}
          WORKFLOWS_REQUIRED: ${{ needs.dependency-check.outputs.workflows }}
          CODE_RESULT: ${{ needs.code.result }}
          UI_RESULT: ${{ needs.ui.result }}
          POSIX_RESULT: ${{ needs.posix.result }}
          STREAM_DECK_RESULT: ${{ needs.stream-deck.result }}
          STREAM_DECK_INTEGRATION_RESULT: ${{ needs.stream-deck-integration.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
          SKILLS_RESULT: ${{ needs.skills.result }}
          WORKFLOWS_RESULT: ${{ needs.actionlint.result }}
        run: |
          if ($env:GITLEAKS_RESULT -ne 'success') {
            throw 'Required secret scan did not succeed.'
          }
          if ($env:DEPENDENCY_RESULT -ne 'success') {
            throw 'Change detection failed; test selection is not verified.'
          }
          if ($env:CONTRACTS_REQUIRED -ne 'true' -and $env:CONTRACTS_REQUIRED -ne 'false') {
            throw 'Missing or invalid contract-test selection.'
          }
          foreach ($suite in @('CODE', 'UI', 'DOCUMENTATION', 'SKILLS', 'WORKFLOWS', 'POSIX', 'STREAM_DECK', 'STREAM_DECK_INTEGRATION')) {
            $required = [Environment]::GetEnvironmentVariable("${suite}_REQUIRED")
            $result = [Environment]::GetEnvironmentVariable("${suite}_RESULT")
            if ($required -ne 'true' -and $required -ne 'false') {
              throw "Missing or invalid selection for ${suite}."
            }
            if (($required -eq 'true' -and $result -ne 'success') -or
                ($required -eq 'false' -and $result -ne 'skipped')) {
              throw "Unexpected result for ${suite}: ${result}."
            }
            Write-Output "${suite}: required=${required}, result=${result}"
          }
