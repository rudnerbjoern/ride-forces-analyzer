<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Ride Forces Analyzer</title>
		<style>
			:root {
				color-scheme: dark;
				font:
					13px system-ui,
					sans-serif;
				background: #2d2d2d;
				color: #e5e5e5;
			}
			body {
				margin: 12px;
			}
			label {
				display: grid;
				grid-template-columns: 90px 1fr;
				align-items: center;
				gap: 8px;
				margin: 10px 0;
			}
			select {
				background: #414141;
				color: inherit;
				border: 1px solid #666;
				border-radius: 3px;
				padding: 5px;
				width: 100%;
			}
			[hidden] {
				display: none;
			}
			p {
				line-height: 1.45;
				color: #bbb;
			}
			#settings-status {
				color: #e6b56b;
				margin: 8px 0;
			}
			a {
				color: #8cc8ff;
			}
		</style>
	</head>
	<body>
		<label
			><span data-i18n="Action">Action</span
			><select id="operation"></select
		></label>
		<label id="direction-row" hidden
			><span data-i18n="Direction">Direction</span
			><select id="direction">
				<option value="-1" data-i18n="Previous / decrease">Previous / decrease</option>
				<option value="1" data-i18n="Next / increase">Next / increase</option>
			</select></label
		>
		<label id="boundary-row" hidden
			><span data-i18n="Selection">Selection</span
			><select id="boundary">
				<option value="start" data-i18n="Start">Start</option>
				<option value="end" data-i18n="End">End</option>
			</select></label
		>
		<label id="steps-row" hidden
			><span data-i18n="Step">Step</span
			><select id="steps">
				<option value="-20" data-i18n="− coarse (20 samples)">− coarse (20 samples)</option>
				<option value="-10" data-i18n="− medium (10 samples)">− medium (10 samples)</option>
				<option value="-1" data-i18n="− fine (1 sample)">− fine (1 sample)</option>
				<option value="1" data-i18n="+ fine (1 sample)">+ fine (1 sample)</option>
				<option value="10" data-i18n="+ medium (10 samples)">+ medium (10 samples)</option>
				<option value="20" data-i18n="+ coarse (20 samples)">+ coarse (20 samples)</option>
			</select></label
		>
		<label id="curve-row" hidden
			><span data-i18n="Curve">Curve</span
			><select id="curve">
				<option value="first" data-i18n="First axis">First axis</option>
				<option value="second" data-i18n="Second axis">Second axis</option>
				<option value="third" data-i18n="Third axis">Third axis</option>
				<option value="combined" data-i18n="Combined">Combined</option>
				<option value="calibrated" data-i18n="Calibrated mode">Calibrated mode</option>
			</select></label
		>
		<label id="marker-row" hidden
			><span data-i18n="Marker">Marker</span
			><select id="marker">
				<option value="start" data-i18n="Start">Start</option>
				<option value="gravity" data-i18n="Gravity">Gravity</option>
				<option value="incline" data-i18n="Incline">Incline</option>
				<option value="end" data-i18n="End">End</option>
			</select></label
		>
		<p id="settings-status" role="status" hidden></p>
		<p
			data-i18n="Enable Stream Deck in Analyzer settings. Commands affect the active Explorer while Analyzer has focus. Keys show confirmed state; unavailable commands are blocked."
		>
			Enable Stream Deck in Analyzer settings. Commands affect the active Explorer while Analyzer has focus. Keys show
			confirmed state; unavailable commands are blocked.
		</p>
		<p data-i18n="Marker steps create a preview. Add separate Apply and Discard keys for that marker.">
			Marker steps create a preview. Add separate Apply and Discard keys for that marker.
		</p>
		<p>
			<a
				id="setup-help"
				href="https://github.com/rudnerbjoern/ride-forces-analyzer/blob/main/docs/user/STREAM_DECK.md"
				data-i18n="Setup and troubleshooting"
				>Setup and troubleshooting</a
			>
		</p>
		<script src="control.js"></script>
	</body>
</html>
