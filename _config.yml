# cspell:words jekyll
title: Ride Forces Analyzer
tagline: Explore your coaster rides and create 4K video overlays
description: Explore Ride Forces recordings and create video overlays on Windows, Linux and macOS. Offline processing, five layouts and optional Stream Deck controls.
url: https://rudnerbjoern.github.io
baseurl: /ride-forces-analyzer
repository: rudnerbjoern/ride-forces-analyzer
remote_theme: pages-themes/midnight@v0.2.0
plugins:
  - jekyll-remote-theme
show_downloads: true
exclude:
