  - AGENTS.md
  - CONTRIBUTING.md
  - SECURITY.md
  - THIRD_PARTY_NOTICES.md
  - LICENSE
  - src
  - tests
  - scripts
  - packaging
  - node_modules
  - .venv
  - .tmp
  - dist
  - build
  - exports
  - package.json
  - package-lock.json
  - pyproject.toml
  - uv.lock
  - setup.ps1
  - start.ps1
  - ffmpeg.json
